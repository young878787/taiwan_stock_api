[project]
name = "kstock"
version = "0.1.0"
description = "台股資料管道與 RESTful API：TWSE + SQLite + FastAPI / Parquet + DuckDB"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "duckdb>=1.0.0",
  "httpx>=0.27.0",
  "fastapi>=0.115.0",
  "pydantic>=2.10.0",
  "polars>=1.20.0",
  "pyarrow>=25.0.1",
  "python-dotenv>=1.0.0",
  "yfinance>=1.7.0",
  "uvicorn>=0.30.0",
]

[dependency-groups]
ai = [
    "instructor>=1.0",
    "pydantic-ai-slim[mcp,openai,prefect]>=1.0,<2",
    "pyqlib>=0.9.7",
    "rdagent>=0.8.0",
]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
default-groups = ["dev", "ai"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kstock", "src/qlab"]
