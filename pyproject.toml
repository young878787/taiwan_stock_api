[project]
name = "kstock"
version = "0.1.0"
description = "台股量化研究資料管道：FinMind + TWSE → Parquet + DuckDB → Backtest"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "duckdb>=1.0.0",
  "httpx>=0.27.0",
  "polars>=1.20.0",
  "pyarrow>=25.0.1",
  "python-dotenv>=1.0.0",
  "yfinance>=1.7.0",
]

[dependency-groups]
ai = [
    "pyqlib>=0.9.7",
    "rdagent>=0.8.0",
]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
default-groups = ["dev", "ai"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kstock", "src/qlab"]
